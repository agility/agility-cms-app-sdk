name: Publish to npm

# Publishes @agility/app-sdk when a version tag is pushed, then creates the GitHub release
# from that version's section of CHANGELOG.md.
#
# Release flow (CONTRIBUTING.md, "Releasing"):
#   1. Bump "version" in package.json, add its "## <version>" section to CHANGELOG.md, merge.
#   2. Tag the merged commit and push the tag:
#        git tag v2.5.0-beta.0 && git push origin v2.5.0-beta.0
#   3. This workflow checks the tag, the changelog section and the branch, builds, tests,
#      publishes with provenance, and creates the release.
#
# The npm dist-tag comes from the version and the branch, never from a default:
#   - a prerelease (2.5.0-beta.0) goes to its prerelease id ("beta") and is a GitHub prerelease;
#   - a stable version on main goes to "latest";
#   - a stable version on release/<major>.x (fixes to an older major) goes to
#     "release-<major>.x", never "latest".
#
# Auth is npm Trusted Publishing (OIDC), so no npm token is stored. One-time setup by a package
# owner on npmjs.com: add this repository and this workflow file (npm-publish.yml) as a trusted
# publisher for @agility/app-sdk.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create
  id-token: write # npm Trusted Publishing and provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, publish and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches package.json
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $PKG_VERSION."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Pick the npm dist-tag
        id: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"
            ID="${PRE%%.*}"
            if ! [[ "$ID" =~ ^[a-z]+$ ]] || [ "$ID" = "latest" ]; then
              echo "::error::Prerelease id '$ID' in $VERSION can't be used as a dist-tag."
              exit 1
            fi
            echo "tag=$ID" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAJOR="${VERSION%%.*}"
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet "origin/release/$MAJOR.x" > /dev/null \
            && git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/$MAJOR.x"; then
            echo "tag=release-$MAJOR.x" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$GITHUB_REF_NAME is a stable version but its commit isn't on main or release/$MAJOR.x."
            exit 1
          fi
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The section under "## <version>" (or "## [<version>]"), up to the next "## ".
          awk -v v="$VERSION" '
            /^## / { h = $2; gsub(/[][]/, "", h); if (found) exit; if (h == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section. Add one before tagging."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: yarn

      - name: Use an npm with Trusted Publishing support
        run: npm install -g npm@^11.5.1

      - name: Install dependencies (builds via prepare)
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Publish
        run: npm publish --provenance --access public --tag "${{ steps.dist.outputs.tag }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          if [ "${{ steps.dist.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease --latest=false)
          elif [ "${{ steps.dist.outputs.tag }}" != "latest" ]; then
            FLAGS+=(--latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${FLAGS[@]}"
